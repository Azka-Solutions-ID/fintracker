name: ci

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - name: contrast tokens
        run: bun run check:tokens
      - name: unit tests
        run: bun test packages
      - name: build both apps
        run: bun run build
